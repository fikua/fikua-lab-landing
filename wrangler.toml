# Cloudflare Workers (Static Assets) configuration.
# Pure-static site under https://lab.fikua.com/ (catch-all). No Worker
# code, no backend proxy. Cloudflare serves the files in `directory`
# directly from its global edge cache.

name = "fikua-lab-landing"
compatibility_date = "2026-05-22"

# Lowest-priority route: any path on lab.fikua.com that no other lab
# Workers project claims (issuer/, verifier/, wallet/, portal/) lands
# here.
routes = [
    { pattern = "lab.fikua.com/*", custom_domain = false, zone_name = "fikua.com" }
]

[assets]
directory = "./public"
not_found_handling = "404-page"
